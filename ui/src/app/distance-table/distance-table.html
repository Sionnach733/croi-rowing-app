<div class="summary">
  <h1>Total Metres</h1>
  <h2 id="totalMetres">{{ totalDistance() | number }} / {{ target | number }}</h2>
</div>

<mat-progress-bar mode="determinate" [value]="percentage()" />
<p class="percent">{{ percentage() }}%</p>

@if (percentage() === 100) {
  <h1 class="goal">Goal Achieved!</h1>
}

<app-my-map />

<table mat-table [dataSource]="rowers()">
  <ng-container matColumnDef="rower">
    <th mat-header-cell *matHeaderCellDef>Rower</th>
    <td mat-cell *matCellDef="let element">{{ element.rower }}</td>
  </ng-container>

  <ng-container matColumnDef="distance">
    <th mat-header-cell *matHeaderCellDef>Distance</th>
    <td mat-cell *matCellDef="let element">{{ element.distance | number }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
